# Tightly coupled GNSS/IMU FGO (see src/positioning/fgo/README.md).
# Set the surveyed base position and the IMU-to-antenna lever arm (body axes FLU
# after imu_orientation, metres).
# initial_position defaults to the base. The header time scale (UTC or GPST) is
# taken from the rover observations; IMU stamps must use the same clock.
# A parameter the node does not declare (see the README) stops it at startup.
gnss_imu_fgo:
  ros__parameters:
    topics:
      rover_observation: /gnss/observation
      base_observation: /base/gnss/observation
      ephemeris: /gnss/ephemeris
      imu: /gnss/imu/data_raw
      solution: /gnss/solution
    base_position:
      postype: ecef
      pos:
      - 0.0
      - 0.0
      - 0.0
    # ENU origin of pos_enu and <topics.solution>_odom: "auto" = base station (base_position) | "fixed" = pos below
    local_origin:
      mode: auto
      postype: llh                  # llh | ecef
      pos: [0.0, 0.0, 0.0]          # llh: [lat_deg, lon_deg, h_m]; ecef: [x, y, z] m
    lever_arm:
    - 0.0
    - 0.0
    - 0.0
    imu_orientation:
    - 0.0
    - 0.0
    - 0.0
    # Observations: same names as real_time_kinematic (see the README for the SNR mask).
    frequencies:
      enable_l1: true
      enable_l2: true
      enable_l5: false
    pos1:
      elmask: 15.0
      navsys:
        gps: true
        gal: true
        bds: true
        qzs: true
      snrmask:
        rover: true
        base: true
        l1: [35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0]
        l2: [35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0]
        l5: [35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0]
    pos2:
      armode: 3     # 0: off, 3: fix and hold
      arthres: 3.0
      minfixsats: 4
      slipthres: 0.15
    # Vehicle constraints; enable only on a ground vehicle (see the README).
    nhc:
      enable: false
    zupt:
      enable: false
    max_age_s: 30.0
    queue_depth: 4096
