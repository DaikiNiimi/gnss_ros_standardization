gnss_imu_fgo:
  ros__parameters:
    topics:
      rover_observation: "/gnss/observation"
      base_observation: "/base/gnss/observation"
      ephemeris: "/gnss/ephemeris"
      imu: "/gnss/imu/data_raw"
      solution: "/gnss/fgo/solution"

    # Base station antenna position. REQUIRED (see tightly_coupled_fgo README).
    base_position:
      postype: "llh"
      pos: [0.0, 0.0, 0.0]

    # Body-frame lever arm from IMU origin to GNSS antenna [m] (x fwd, y left, z up).
    lever_arm: [0.0, 0.0, 0.0]

    # GNSS epoch time for IMU pairing (see README):
    #   header          : use header.stamp as-is (default)
    #   tow_auto_offset : rebuild epoch from week/tow, strip receiver latency
    time:
      gnss_epoch_source: "header"
      offset_window_s: 60.0        # [s] tow_auto_offset window

    # ENU nav anchor (also ENU output origin). "gnss_fix": first fix | "manual": pos below.
    local_origin:
      mode: "gnss_fix"
      postype: "llh"
      pos: [0.0, 0.0, 0.0]

    masks:
      elevation_deg: 15.0
      snr_dbhz: 35.0          # flat SNR mask [dBHz]; 0 disables it
      # Elevation-dependent SNR mask (RTKLIB testsnr).
      snrmask:
        enable: true
        l1: [35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0]
        l2: [35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0]
        l5: [35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0]

    navsys:
      gps: true
      glo: false
      gal: true
      bds: true
      qzs: true
    glonass_carrier_dd: false

    # Dual-frequency (L1+L2) improves instantaneous AR reliability.
    frequencies:
      enable_l1: true
      enable_l2: true
      enable_l5: false

    max_age_s: 5.0

    # Rover-base cycle-slip detection (see gnss_fgo.yaml for details).
    cycle_slip:
      gf_enable: true
      gf_threshold_m: 0.05
      cmc_enable: true
      cmc_threshold_m: 3.0
      dop_enable: true
      dop_threshold_cyc: 1.0
      max_gap_s: 2.0

    # Undifferenced (zenith) measurement sigmas; DD noise is derived by error
    # propagation.
    noise:
      pr_sigma_m: 0.5
      cp_sigma_m: 0.005
      elevation_weighting: true

    # Robust (Huber M-estimator) measurement noise on the DD factors.
    robust:
      enable: true
      huber_k: 1.345

    ambiguity:
      mode: "instantaneous"        # instantaneous | continuous | fix_and_hold
      prior_sigma_cycles: 100.0    # loose prior on every (fresh) ambiguity
      ref_prior_sigma_cycles: 0.001  # instantaneous only: tight per-group reference prior
      init_sigma_cycles: 20.0        # continuous/fix_and_hold: prior on a new/re-keyed ambiguity
      hold_sigma_cycles: 0.03        # fix_and_hold: held integer DD std dev [cycle]
      max_outage_s: 5.0              # continuous/fix_and_hold: re-key gap [s]

    ambiguity_resolution:
      enable: true
      ratio_threshold: 3.0
      el_mask_deg: 15.0
      min_fix: 5
      fde_enable: true          # fault detection & exclusion on post-fix residuals
      fde_threshold_m: 0.05
      fde_max_exclude: 2

    # ENU output origin: fixed_origin (if set) > local nav anchor > base.
    fixed_origin:
      postype: "llh"
      pos: [0.0, 0.0, 0.0]

    # GNSS Doppler velocity factor on V(k).
    motion:
      vel_sigma_mps: 0.1      # floor on the Doppler velocity sigma

    # IMU noise densities (defaults follow gnss_imu_kalman_filter.yaml).
    imu:
      sigma_acc: 0.3          # [m/s^2/sqrt(Hz)]
      sigma_gyr: 0.01         # [rad/s/sqrt(Hz)]
      sigma_acc_bias: 1.0e-4  # [m/s^2/sqrt(s)]
      sigma_gyr_bias: 1.0e-5  # [rad/s/sqrt(s)]
      # Fallback process-noise rate [m/s] used only when the IMU-stage ISAM2
      # marginal is unavailable.
      pred_sigma_mps: 1.0

    # Static initialization: platform must be stationary for imu_duration
    # seconds. Yaw is unknown until the platform accelerates/turns.
    init:
      imu_duration: 1.0       # [s]
      pos_std: 10.0           # [m]
      vel_std: 0.3            # [m/s]
      att_std_rp: 0.1         # [rad]
      att_std_yaw: 3.14159    # [rad]
      acc_bias_std: 0.1       # [m/s^2]
      gyr_bias_std: 0.01      # [rad/s]

    isam2:
      relinearize_threshold: 0.01
      relinearize_skip: 1
