# Tightly coupled GNSS/IMU FGO (see src/positioning/fgo/README.md).
# Set the surveyed base position and the IMU-to-antenna lever arm (FLU, metres).
# initial_position defaults to the base. The header time scale (UTC or GPST) is
# taken from the rover observations; IMU stamps must use the same clock.
# Parameters not listed in the README are rejected at startup.
gnss_imu_fgo:
  ros__parameters:
    algorithm_profile: ratio3_direct_v1
    topics:
      rover_observation: /gnss/observation
      base_observation: /base/gnss/observation
      ephemeris: /gnss/ephemeris
      imu: /gnss/imu/data_raw
      solution: /gnss/solution
    base_position:
      postype: ecef
      pos:
      - 0.0
      - 0.0
      - 0.0
    # ENU origin of pos_enu and <topics.solution>_odom: "auto" = base station (base_position) | "fixed" = pos below
    local_origin:
      mode: auto
      postype: llh                  # llh | ecef
      pos: [0.0, 0.0, 0.0]          # llh: [lat_deg, lon_deg, h_m]; ecef: [x, y, z] m
    lever_arm:
    - 0.0
    - 0.0
    - 0.0
    imu_orientation:
    - 0.0
    - 0.0
    - 0.0
    max_age_s: 30.0
    queue_depth: 4096
