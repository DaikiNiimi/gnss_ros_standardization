# Septentrio Driver Configuration
# 
# Usage:
#   ros2 run gnss_ros_standardization sbf_driver_node --ros-args \
#     --params-file config/sbf_driver.yaml

sbf_driver_node:
  ros__parameters:
    # ==========================================================================
    # Basic Settings
    # ==========================================================================
    
    # Stream path (serial, tcp, ntrip, file)
    # Examples:
    #   serial:///dev/ttyACM0:115200
    #   tcpcli://192.168.1.100:5000
    stream_path: "serial:///dev/ttyACM1:115200"
    
    # Measurement rate in Hz (1-100)
    publish_rate: 10
    
    # ROS settings
    frame_id: "gnss_link"
    
    # Send configuration commands on startup
    # Set to false to use the receiver's current configuration as-is
    configure_on_startup: true

    # Use GPS week/tow for message header stamps instead of system clock
    use_gps_timestamp: false

    # Topic Names
    observation_topic: "/gnss/observation"
    ephemeris_topic: "/gnss/ephemeris"
    solution_topic: "/gnss/nmea_solution"
    imu_raw_topic: "/gnss/imu/data_raw"       # ExtSensorMeas (uncalibrated)

    # ==========================================================================
    # Receiver Configuration
    # ==========================================================================
    
    # Receiver output port
    # Specifies which logical port on the receiver to configure for SBF output.
    # Common values: USB1, USB2, COM1, COM2, IP10...
    # Must match the physical connection used by stream_path.
    receiver_port: "USB2"

    # ==========================================================================
    # Output Messages
    # ==========================================================================
    messages:
      meas_epoch: true       # Raw observations (MeasEpoch)

      # Decoded navigation blocks (receiver-assembled; GPSNav/GLONav/GALNav/BDSNav/QZSNav/NavICNav)
      # These arrive as a single complete ephemeris per block — faster than raw subframe accumulation.
      gps_nav: true          # GPSNav    (ID 5891) — GPS decoded ephemeris
      glo_nav: true          # GLONav    (ID 4004) — GLONASS decoded state vector
      gal_nav: true          # GALNav    (ID 4002) — Galileo decoded ephemeris
      bds_nav: true          # BDSNav    (ID 4081) — BeiDou decoded ephemeris
      qzs_nav: true          # QZSNav    (ID 4095) — QZSS decoded ephemeris
      navic_nav: true        # NavICLNav (ID 4254) — NavIC decoded ephemeris

      # Raw navigation subframe blocks (decoded by RTKLIB input_sbf()).
      # Enabling these makes the receiver emit subframes at ~6 s cadence per
      # satellite. RTKLIB accumulates them in raw->subfrm[sat-1] and produces
      # a fresh ephemeris within 15-30 s of decoder start — so a bag started
      # mid-pass still captures the full visible-sat ephemeris set instead of
      # waiting up to ~2 h for the next IODE rollover (which is when Decoded
      # NAV blocks re-fire). Recommended ON for record/replay workflows.
      # Both decoded and raw can be enabled simultaneously; duplicates are filtered by IODE/IODC.
      gps_nav_raw: true       # GPSRawCA    (ID 4017) — GPS L1 C/A subframe
      glo_nav_raw: true       # GLORawCA    (ID 4026) — GLONASS L1 C/A string
      gal_nav_raw: true       # GALRawINAV+GALRawFNAV (ID 4023+4022) — Galileo I/F-NAV
      bds_nav_raw: true       # BDSRaw      (ID 4047) — BeiDou navigation frame
      qzs_nav_raw: true       # QZSRawL1CA  (ID 4066) — QZSS L1 C/A subframe
      navic_nav_raw: true     # NAVICRaw    (ID 4093) — NavIC subframe
      
      # Binary PVT (preferred over NMEA when enabled — produces full-precision
      # GnssSolution with 3x3 covariance). See "Solution source policy" below.
      # When pvt_geodetic=true, pos_cov_geodetic=true is strongly recommended
      # (otherwise pos_enu_cov will be zero). Same applies to pvt_cartesian /
      # pos_cov_cartesian for ECEF.
      pvt_geodetic: false       # PVTGeodetic    (ID 4007) → LLH + vel_NED
      pos_cov_geodetic: false   # PosCovGeodetic (ID 5906) → pos_enu_cov 3x3
      vel_cov_geodetic: false   # VelCovGeodetic (ID 5908) → vel_enu_cov 3x3
      pvt_cartesian: false      # PVTCartesian    (ID 4006) → ECEF pos + vel
      pos_cov_cartesian: false  # PosCovCartesian (ID 5905) → pos_cov_ecef 3x3
      vel_cov_cartesian: false  # VelCovCartesian (ID 5907) → vel_cov_ecef 3x3
      dop: false                # DOP            (ID 4001) → pdop/hdop/vdop (+ gdop = sqrt(pdop²+tdop²))

      # IMU output (requires AsteRx-i / mosaic-X5 or other receiver with integrated IMU)
      ext_sensor_meas: false   # Uncalibrated raw IMU accel + gyro → /gnss/imu/data_raw

      # NMEA output (used for GnssSolution topic via NmeaParser)
      # Sentences are output on the same physical port as SBF (Stream2, sec1 = 1 Hz)
      nmea_gga: true         # GGA: position, fix quality, satellites, HDOP, altitude
      nmea_rmc: true         # RMC: velocity (speed/course)
      nmea_gsa: true         # GSA: DOP values
      nmea_gst: true         # GST: position standard deviations (for covariance)

    # Solution source policy (locked at startup):
    #   If messages.pvt_geodetic OR messages.pvt_cartesian is true → BINARY
    #     source (NMEA is parsed for state but not published)
    #   Otherwise → NMEA source
    # No mid-session switching. If BINARY is selected and the binary stream
    # stops, /gnss/nmea_solution publication pauses rather than falling back.

    # Ephemeris publishing — snapshot-on-change + heartbeat
    # Topic always carries the full current state; logging this one topic is
    # sufficient for both RINEX conversion and downstream positioning.
    # ENU local origin settings
    auto_origin: true              # false: use origin below; true: first valid fix
    origin: [0.0, 0.0, 0.0]       # [lat_deg, lon_deg, alt_m (ellipsoidal)]

    ephemeris:
      snapshot_period_s: 30.0    # heartbeat interval when no new ephemeris arrives
      max_age_s:         7200.0  # drop entries older than this from snapshots (2 h)
