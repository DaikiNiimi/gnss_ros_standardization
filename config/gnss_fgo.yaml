gnss_fgo:
  ros__parameters:
    topics:
      rover_observation: "/gnss/observation"
      base_observation: "/base/gnss/observation"
      ephemeris: "/gnss/ephemeris"
      solution: "/gnss/fgo/solution"

    # Base station antenna position. REQUIRED.
    # postype: "llh" (deg, deg, ellipsoidal m) or "ecef" (m)
    base_position:
      postype: "llh"
      pos: [0.0, 0.0, 0.0]

    # ENU output origin. Priority: fixed_origin > base_position.
    fixed_origin:
      postype: "llh"
      pos: [0.0, 0.0, 0.0]

    masks:
      elevation_deg: 15.0
      snr_dbhz: 35.0          # flat SNR mask [dBHz]; 0 disables it
      # Elevation-dependent SNR mask (RTKLIB testsnr); takes precedence over
      # snr_dbhz when enabled. Nine thresholds [dBHz] at 5,15,...,85 deg per band.
      snrmask:
        enable: true
        l1: [35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0]
        l2: [35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0]
        l5: [35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0]

    # GLONASS off by default (FDMA inter-frequency biases don't cancel in DD
    # across heterogeneous receivers).
    navsys:
      gps: true
      glo: false
      gal: true
      bds: true
      qzs: true
    glonass_carrier_dd: false

    # Dual-frequency (L1+L2) is recommended for reliable instantaneous AR.
    frequencies:
      enable_l1: true
      enable_l2: true
      enable_l5: false

    # Maximum rover-base age for forming DD pairs [s].
    max_age_s: 5.0

    # Rover-base cycle-slip detection. LLI bit, half-cycle-bit transition, and
    # observed-code change (both receivers) are always on; the rest are configurable.
    cycle_slip:
      gf_enable: true           # SD geometry-free (dual-freq)
      gf_threshold_m: 0.05
      cmc_enable: true          # SD code-minus-carrier gross error
      cmc_threshold_m: 3.0
      dop_enable: true          # Doppler-phase (single-freq safeguard)
      dop_threshold_cyc: 1.0
      max_gap_s: 2.0            # carrier outage [s]

    # Undifferenced (zenith) measurement sigmas; DD noise is derived from these
    # by error propagation.
    noise:
      pr_sigma_m: 0.5        # undifferenced pseudorange sigma [m]
      cp_sigma_m: 0.005      # undifferenced carrier phase sigma [m]
      elevation_weighting: true   # sigma / sin(elevation)

    # Robust (Huber M-estimator) measurement noise on the DD factors.
    robust:
      enable: true
      huber_k: 1.345

    ambiguity:
      mode: "instantaneous"        # instantaneous | continuous | fix_and_hold
      prior_sigma_cycles: 100.0    # loose prior on every (fresh) ambiguity
      ref_prior_sigma_cycles: 0.001  # instantaneous only: tight per-group reference prior
      init_sigma_cycles: 20.0        # continuous/fix_and_hold: prior on a new/re-keyed ambiguity
      hold_sigma_cycles: 0.03        # fix_and_hold: held integer DD std dev [cycle]
      max_outage_s: 5.0              # continuous/fix_and_hold: re-key gap [s]

    ambiguity_resolution:
      enable: true
      ratio_threshold: 3.0
      el_mask_deg: 15.0
      min_fix: 5
      fde_enable: true          # fault detection & exclusion on post-fix residuals
      fde_threshold_m: 0.05
      fde_max_exclude: 2

    # Loose prior on the rover position; used only on the first epoch and after
    # a motion gap (otherwise carried across epochs by the motion factor below).
    position_prior:
      std_m: 100.0

    # Inter-epoch motion factor (Doppler-derived displacement).
    motion:
      vel_sigma_mps: 0.1      # floor on the Doppler velocity sigma
      accel_sigma_mps2: 3.0   # unmodelled acceleration (process noise)
      max_dt_s: 5.0           # beyond this gap, re-anchor with the position prior

    isam2:
      relinearize_threshold: 0.01
      relinearize_skip: 1
