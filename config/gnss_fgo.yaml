gnss_fgo:
  ros__parameters:
    topics:
      rover_observation: "/gnss/observation"
      base_observation: "/base/gnss/observation"
      ephemeris: "/gnss/ephemeris"
      solution: "/gnss/solution"

    # Base station antenna position. REQUIRED.
    # postype: "llh" (deg, deg, ellipsoidal m) or "ecef" (m)
    base_position:
      postype: "llh"
      pos: [35.70494444, 139.72169444, 74.380]

    # ENU output origin. Priority: fixed_origin > base_position.
    fixed_origin:
      postype: "llh"
      pos: [0.0, 0.0, 0.0]

    masks:
      elevation_deg: 15.0
      snr_dbhz: 35.0          # flat SNR mask [dBHz]; 0 disables it

    # GLONASS off by default (FDMA inter-frequency biases don't cancel in DD
    # across heterogeneous receivers).
    navsys:
      gps: true
      glo: false
      # Use GLONASS for the undifferenced product (SPP, Doppler velocity) while
      # keeping it out of double differencing, and so out of AR. Needs glo: true.
      glo_undifferenced_only: false
      gal: true
      bds: true
      qzs: true

    # Dual-frequency (L1+L2) is recommended for reliable ambiguity resolution.
    frequencies:
      enable_l1: true
      enable_l2: true
      enable_l5: false
      # Allow a carrier DD whose rover and base codes differ, where that is
      # integer-safe (the bias is common to the group and cancels in the DD).
      cross_code_pairing: true

    # Maximum rover-base age for forming DD pairs [s].
    max_age_s: 5.0

    measurement:
      iono_model: "brdc"
      trop_model: "saas"
      base_correlation_model: "variance_inflation"
      base_reuse_factor: 1.0

    # Rover-base cycle-slip detection. Only the two data-dependent thresholds
    # are exposed; the rest of the detectors are fixed constants (see README).
    cycle_slip:
      gf_threshold_m: 0.05    # SD geometry-free jump [m]
      max_gap_s: 2.0          # carrier-outage gap that re-keys an arc [s]

    # Undifferenced (zenith) sigmas; DD noise is propagated from these.
    noise:
      pr_sigma_m: 0.5         # undifferenced pseudorange sigma [m]
      cp_sigma_m: 0.005       # undifferenced carrier phase sigma [m]
      pr_innov_gate_m: 0.0    # DD pseudorange innovation gate [m] (0 = off)
      doppler_max_res_m: 2.0  # reject Doppler motion aiding above this RMS [m/s]
      doppler_max_nsigma: 4.0  # per-satellite Baarda w-test in the Doppler solve (0 = off)
      # A-priori zenith range-rate sigma [m/s], scaled by 1/sin^2(elevation).
      # A real noise figure, not a relative weight: it sets the reported
      # velocity covariance and the w-test reference.
      doppler_sigma_mps: 0.1

    # LAMBDA + ratio test + FDE + partial AR on the graph posterior; accepted
    # integers are held as gauge-free constraints. See the README table.
    ambiguity:
      resolution: true        # false = FLOAT-only (scores the float on its own)
      fde_max_exclude: 2
      ratio_threshold: 3.0    # LAMBDA ratio-test threshold
      min_fix: 4              # minimum DDs to attempt a fix
      min_lock: 5             # continuous epochs before a DD may enter LAMBDA
      min_fix_to_hold: 10     # consecutive fixes before holding (RTKLIB minfix)
      partial_max_drop: 5     # maximum DDs removed by partial AR
      max_pos_var_m2: 0.25    # skip AR above this float pos variance (RTKLIB arthres1)
      max_outage_s: 5.0       # re-key a carried ambiguity after this outage [s]
      hold_refresh_s: 30.0    # re-verify a held arc at this age [s] (0 = never)

    # Inter-epoch motion model (Doppler-derived displacement).
    motion:
      accel_sigma_mps2: 3.0   # unmodelled-acceleration process noise [m/s^2]

    graph:
      # Fixed-lag window [s]. Bounds the per-epoch solve cost; older variables
      # are marginalized into a prior, so carrier phase still accumulates.
      # Solve cost is near-linear in the window, so raising this trades output
      # latency for accuracy. <= 0 uses full-history ISAM2 (offline only).
      lag_s: 25.0

    debug:
      ar_dump_dir: ""         # per-epoch AR dump directory (empty = off)
