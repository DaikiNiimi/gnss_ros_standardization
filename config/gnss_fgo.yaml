# GNSS-only antenna position/velocity; no IMU, NHC or ZUPT.
# Fixed Ratio 3.0 direct FIX/hold profile; see the FGO README.
gnss_fgo:
  ros__parameters:
    algorithm_profile: gnss_motion_ratio3_v1
    topics:
      rover_observation: /gnss/observation
      base_observation: /base/gnss/observation
      ephemeris: /gnss/ephemeris
      solution: /gnss/solution
    base_position:
      postype: ecef
      pos:
      - 0.0
      - 0.0
      - 0.0
    # ENU origin of pos_enu and <topics.solution>_odom: "auto" = base station (base_position) | "fixed" = pos below
    local_origin:
      mode: auto
      postype: llh                  # llh | ecef
      pos: [0.0, 0.0, 0.0]          # llh: [lat_deg, lon_deg, h_m]; ecef: [x, y, z] m
    max_age_s: 30.0
    queue_depth: 4096
