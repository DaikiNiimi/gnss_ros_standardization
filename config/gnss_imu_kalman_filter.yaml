gnss_imu_kalman_filter:
  ros__parameters:
    # Local ENU Origin
    local_origin:
      mode: "gnss_fix"          # "gnss_fix": first valid GNSS fix | "manual": use pos below
      pos: [0.0, 0.0, 0.0]      # [lat_deg, lon_deg, alt_m] (used when mode="manual")

    # Topic Names
    topics:
      gnss_solution: "/gnss/nmea_solution"
      imu_raw: "/gnss/imu/data_raw"
      wheel_speed: "/can_twist"
      solution: "/gnss/fusion/ekf_solution"

    # EKF Parameters
    ekf:
      # Process noise spectral densities [x, y, z]
      sigma_acc:      [0.3, 0.3, 0.3]               # [m/s²/√Hz]
      sigma_gyr:      [0.01, 0.01, 0.01]            # [rad/s/√Hz]
      sigma_acc_bias: [1.0e-4, 1.0e-4, 1.0e-4]     # [m/s²/√s]
      sigma_gyr_bias: [1.0e-5, 1.0e-5, 1.0e-5]     # [rad/s/√s]

      # Initial state covariance (1σ standard deviations) [x, y, z]
      init_pos_std:      [5.0, 5.0, 10.0]           # [m]
      init_vel_std:      [0.3, 0.3, 0.3]            # [m/s]
      init_att_std:      [0.1, 0.1, 3.14159]        # [rad] (yaw = π: fully unknown)
      init_acc_bias_std: [0.1, 0.1, 0.1]            # [m/s²]
      init_gyr_bias_std: [0.01, 0.01, 0.01]         # [rad/s]

      # Store-and-rewind alignment for late GNSS/wheel measurements (see README).
      # false = immediate update; imu_buffer_duration must exceed worst GNSS latency.
      time_align_to_gnss: true
      imu_buffer_duration: 2.0                      # [s] IMU/state snapshot retention

      # GNSS epoch time for IMU pairing (see README):
      #   header          : use header.stamp as-is (default)
      #   tow_auto_offset : rebuild epoch from week/tow, strip receiver latency
      gnss_time_source: "header"
      gnss_offset_window_s: 60.0                    # [s] tow_auto_offset window

    # GNSS Observation Update Mode
    # "fix_only" | "fix_float" | "all" (never STATUS_EKF). fix_float recommended:
    # fix_only starves the filter during RTK dropouts, drift snaps back (see README).
    gnss_update_mode:  "fix_float"

    # *_cov_source: "message" = use the reported covariance (default; yaml sigma
    # below as the degenerate fallback) | "config" = always use the yaml sigma.
    gnss:
      pos_cov_source: "message"                    # "message" | "config"
      vel_cov_source: "message"                    # "message" | "config"
      pos_sigma_default_fix:   [0.05, 0.05, 0.10]  # [m] RTK FIX
      pos_sigma_default_float: [1.0, 1.0, 3.0]     # [m] RTK FLOAT
      pos_sigma_default_other: [10.0, 10.0, 30.0]  # [m] DGPS/SBAS/SINGLE/PPP
      cov_min_var: 1.0e-6                          # [m²]
      vel_sigma_default: 0.2                       # [m/s]

    # CSV Log Output
    csv:
      dir: ""                                    # output directory ("" = cwd)
      sensors_log_enabled: true                  # raw sensor data log (IMU/GNSS/wheel speed) at IMU rate
      sensors_log_filename: "ekf_sensors_log.csv"
      state_log_enabled: true                   # EKF estimated state + diagonal covariance log
      state_log_filename: "ekf_state_log.csv"

    # Wheel Speed (Optional)
    use_wheel_speed: false
    wheel_speed_topic_type: "twist_with_covariance"   # "twist_with_covariance" | "twist"
    wheel_speed_mode: "longitudinal_only"             # "longitudinal_only" | "3d"
    wheel_speed_sigma: 0.1      # default velocity noise [m/s]

    # Non-holonomic constraint (NHC): also constrain body lateral/vertical velocity ≈ 0.
    wheel_nhc_enable: false
    wheel_nhc_sigma_lateral: 0.3   # [m/s]
    wheel_nhc_sigma_vertical: 0.3  # [m/s]

    # Accelerometer Leveling (gravity-reference roll/pitch update)
    # Bounds roll/pitch; noise inflates with kinematic accel & rate, applied at
    # most once per window (see README).
    leveling:
      enable: true
      window: 0.3          # [s] specific-force averaging window AND min update spacing
      sigma_min_deg: 1.0   # [deg] 1-sigma floor (quasi-static)
      acc_gain: 15.0       # [deg per m/s^2] sigma inflation vs linear accel
      gyr_gain: 30.0       # [deg per rad/s] sigma inflation vs ||omega||
      max_acc: 0.5         # [m/s^2] skip the update above this (systematic accel bias)

    # Zero-Velocity Update (ZUPT)
    # v=0 update, gated on a fresh measured stop (speed + std-dev + mean gates).
    # Without a speed reference it fires only if allow_imu_only (see README).
    zupt:
      enable: true
      allow_imu_only: false # apply v=0 with no fresh speed reference (risky; see README)
      window: 0.5          # [s] detection window
      acc_std_thresh: 0.15 # [m/s^2] max acc std-dev in window
      gyr_std_thresh: 0.02 # [rad/s] max gyro std-dev in window
      gyr_mean_thresh: 0.05 # [rad/s] reject if |mean(gyr)-bias| exceeds (turning)
      acc_mean_thresh: 0.5 # [m/s^2] reject if | ||mean(acc)-bias|| - g | exceeds
      sigma: 0.05          # [m/s] 1-sigma of the v=0 observation
      min_interval: 0.2    # [s] rate limit between ZUPT updates
      speed_thresh: 0.5    # [m/s] a fresh reference at/below this means "stopped"
      speed_timeout: 1.5   # [s]   max age of the measured-speed reference to trust

    # Initial IMU Averaging
    init_imu_duration: 1.0  # duration to average initial IMU data for roll/pitch [s]

    # true: use init_yaw_deg immediately | false: wait for Doppler heading first.
    use_init_yaw: false
    init_yaw_deg: 0.0   # [deg] initial yaw when use_init_yaw is true

    # State Update Thresholds
    # Continuous yaw aid from GNSS Doppler course (forward-motion model; see
    # README). Code default false; this ground-vehicle demo opts in.
    use_doppler_heading: true
    gnss_heading_speed_threshold: 0.5   # [m/s] min speed to init/update yaw

    # IMU Installation & Lever-Arm
    # Which position the EKF outputs. "imu": IMU | "gnss": GNSS antenna.
    output_reference_frame: "imu"

    # Body-frame lever arm [x,y,z] [m], FROM output_reference_frame's origin TO
    # the other sensor's origin. Verify the sign (see README).
    lever_arm: [0.0, 0.0, 0.0]

    # IMU axis orientation relative to body frame [roll, pitch, yaw] [rad]
    imu_orientation: [0.0, 0.0, 0.0]

    # Output Frames
    # world: Odometry/GnssSolution frame_id ("map": GNSS can jump, not odom-safe).
    # child: Odometry.child_frame_id; "" auto-derives from output_reference_frame.
    frames:
      world: "map"
      child: ""
