gnss_imu_kalman_filter:
  ros__parameters:
    # ==========================================================================
    # Coordinate Frame
    # ==========================================================================
    # "ecef" : ECEF (Earth-Centered Earth-Fixed)
    # "enu"  : Local ENU (East-North-Up)
    coordinate_frame: "enu"

    # Local origin for ENU frame
    local_origin:
      # "gnss_fix" : First valid GNSS Fix solution as origin
      # "manual"   : Use manually specified position below
      mode: "gnss_fix"
      # Manual position [lat_deg, lon_deg, alt_m] (used when mode="manual")
      pos: [35.0, 137.0, 50.0]

    # ==========================================================================
    # Topic Names
    # ==========================================================================
    topics:
      gnss_solution: "/gnss/solution"
      imu_raw: "/imu/data_raw"
      wheel_speed: "/can_twist"
      solution: "/gnss_imu_kalman_filter/solution"

    # ==========================================================================
    # CSV Output
    # ==========================================================================
    csv:
      output_path: "/tmp/gnss_imu_kalman_filter_log.csv"

    # ==========================================================================
    # EKF Parameters
    # ==========================================================================
    ekf:
      # Process noise spectral densities
      sigma_acc: 0.1            # Accelerometer noise [m/s^2/√Hz]
      sigma_gyr: 0.01           # Gyroscope noise [rad/s/√Hz]
      sigma_acc_bias: 1.0e-4    # Accelerometer bias random walk [m/s^2/√Hz]
      sigma_gyr_bias: 1.0e-5    # Gyroscope bias random walk [rad/s/√Hz]

      # Initial state covariance (1-sigma standard deviations)
      init_pos_std: 10.0        # Position [m]
      init_vel_std: 1.0         # Velocity [m/s]
      init_att_std: 0.5         # Attitude [rad]
      init_acc_bias_std: 0.1    # Accelerometer bias [m/s^2]
      init_gyr_bias_std: 0.01   # Gyroscope bias [rad/s]

    # ==========================================================================
    # GNSS Observation Update Mode
    # ==========================================================================
    # "fix_only"  : Use only Fix solutions for position update
    # "fix_float" : Use Fix + Float solutions
    # "all"       : Use all solution types (including Single, SBAS, DGPS, PPP)
    gnss_update_mode: "fix_only"
    
    # ==========================================================================
    # Wheel Speed (Optional)
    # ==========================================================================
    use_wheel_speed: false
    
    # Topic type: "twist_with_covariance" or "twist"
    wheel_speed_topic_type: "twist_with_covariance"
    
    # Mode: "longitudinal_only" (only X-axis forward velocity) or "3d" (all 3 axes)
    wheel_speed_mode: "longitudinal_only"
    
    wheel_speed_sigma: 0.1      # Default velocity noise [m/s]
    
    # ==========================================================================
    # Initial IMU Averaging
    # ==========================================================================
    init_imu_duration: 1.0  # Duration to average initial IMU data for Roll/Pitch estimation [s]

    # Initial yaw angle [deg]. If set, EKF can initialize while stationary without waiting for
    # Doppler heading. Comment out or omit to use Doppler heading (default behavior).
    # init_yaw_deg: 0.0

    # ==========================================================================
    # State Update Thresholds
    # ==========================================================================
    # Minimum valid horizontal speed (from Doppler) to initialize or update yaw [m/s]
    gnss_heading_speed_threshold: 0.5

    # ==========================================================================
    # IMU Installation & Lever-Arm
    # ==========================================================================
    # EKF Output Reference Frame:
    #   "imu"  : EKF estimates and outputs the position of the IMU
    #   "gnss" : EKF estimates and outputs the position of the GNSS antenna
    output_reference_frame: "imu"

    # Lever-arm vector [x, y, z] in body frame [m]
    # This vector MUST point from the 'output_reference_frame' to the other sensor.
    # - If output_reference_frame is "imu", this points from IMU to GNSS antenna.
    # - If output_reference_frame is "gnss", this points from GNSS antenna to IMU.
    lever_arm: [0.0, 0.0, 0.0]

    # IMU axis orientation relative to body frame [roll, pitch, yaw] in radians
    # This rotation transforms IMU measurements to body frame
    imu_orientation: [0.0, 0.0, 0.0]
