# NovAtel Driver Configuration
# 
# Usage:
#   ros2 run gnss_ros_standardization novatel_driver_node --ros-args --params-file config/novatel_driver.yaml

novatel_driver_node:
  ros__parameters:
    # ==========================================================================
    # Connection Settings
    # ==========================================================================
    # Stream path: serial://<device>:<baud> or tcpcli://<host>:<port> or file://<path>
    # Common bauds: 9600, 115200, 230400, 460800, 921600
    stream_path: "serial:///dev/ttyUSB1:230400"

    # Frame ID for checking TF
    frame_id: "gnss_link"

    # GNSS log rate in Hz, 1-20. IMU logs (RAWIMUSX / CORRIMUDATA) are
    # independent of this, requested ONNEW at the IMU's native sample rate.
    publish_rate: 10

    # Receiver port to configure data output on (e.g., USB1, COM1, COM2)
    # This is used in the LOG command: LOG [receiver_port] [message] ONTIME [interval]
    receiver_port: "THISPORT"

    # Whether to send configuration commands on startup
    configure_on_startup: true

    # Use GPS week/tow for message header stamps instead of system clock.
    # Recommended for tight GNSS/IMU coupling: RAWIMUSX/CORRIMUDATA carry
    # their own Week+Seconds, so IMU samples get receiver-clock stamps too.
    use_gps_timestamp: false

    # Topic Names
    observation_topic: "/gnss/observation"
    ephemeris_topic: "/gnss/ephemeris"
    solution_topic: "/gnss/nmea_solution"
    imu_topic:     "/gnss/imu/data"      # CORRIMUDATA (calibrated)
    imu_raw_topic: "/gnss/imu/data_raw"  # RAWIMUSX (uncalibrated)

    # RTCM relay (PC -> receiver) for receiver on-chip RTK. See src/drivers/README.md.
    # NovAtel requires `output` to be a SECOND /dev device (cannot mix RTCM
    # input with NOVATEL commands/logs on one logical port).
    rtcm_relay:
      enabled: false
      listen: "tcpsvr://:5558"    # corrections come in here (TCP server)
      output: ""                  # dedicated correction port, e.g. "serial:///dev/ttyUSB2:230400" (must differ from stream_path)
      correction_port: "THISPORT" # INTERFACEMODE target, sent over `output` (leave THISPORT)

    # ==========================================================================
    # Message Configuration
    # ==========================================================================
    # Enable/Disable specific SBF blocks
    messages:
      # Observation Data
      rangecmp: true        # RANGECMPB (Compressed Range) - Recommended
      range: false          # RANGEB (Uncompressed Range)

      # Position / Velocity — Binary PVT, preferred over NMEA when enabled.
      bestpos: true         # BESTPOSB → LLH + sigma → pos_enu_cov diagonal
      bestvel: false         # BESTVELB → vel_enu (refresh between BESTPOS messages)
      psrdop: false          # PSRDOPB  (ID 174) → gdop/pdop/hdop/vdop
      bestxyz: false        # BESTXYZB (ID 241) → pos_cov_ecef / vel_cov_ecef diag (+ ENU rotation)

      # Navigation Data (Ephemeris)
      gps_ephem: true       # RAWEPHEMB (RTKLIB does not decode GPSEPHEMB)
      glo_ephem: true       # GLOEPHEMERISB
      gal_ephem: true       # GALEPHEMERISB (carries both I/NAV and F/NAV)
      bds_ephem: true       # BDSEPHEMERISB
      qzs_ephem: true       # QZSSRAWEPHEMB (RTKLIB does not decode QZSSEPHEMERISB)
      navic_ephem: true     # NAVICEPHEMERISB

      ionutc: false          # IONUTCB/GALIONOB/QZSSIONUTCB

      # NMEA output (used for GnssSolution topic via NmeaParser, ONTIME 1 = 1 Hz)
      nmea_gpgga: false      # GPGGA: position, fix quality, satellites, HDOP, altitude
      nmea_gprmc: false      # GPRMC: velocity (speed/course)
      nmea_gpgsa: false      # GPGSA: DOP values
      nmea_gpgst: false      # GPGST: position standard deviations (for covariance)

      # IMU output (requires NovAtel receiver with IMU connection)
      rawimusx: false    # RAWIMUSXB: uncalibrated counts → /gnss/imu/data_raw
      corrimudata: false # CORRIMUDATAB: SPAN-corrected → /gnss/imu/data (requires SPAN)

    # IMU scale override, for IMU types unknown to novatel_imu_scales.hpp. Both
    # fields must be non-zero to take effect. See README "Supported NovAtel IMUs".
    imu_scale_override:
      accel: 0.0
      gyro:  0.0

    # ENU local origin settings
    auto_origin: true              # false: use origin below; true: first valid fix
    origin: [0.0, 0.0, 0.0]       # [lat_deg, lon_deg, alt_m (ellipsoidal)]

    # Ephemeris publishing — snapshot-on-change + heartbeat
    # Topic always carries the full current state; logging this one topic is
    # sufficient for both RINEX conversion and downstream positioning.
    ephemeris:
      snapshot_period_s: 30.0    # heartbeat interval when no new ephemeris arrives
      max_age_s:         7200.0  # drop entries older than this from snapshots (2 h)
