# NovAtel Driver Configuration
# 
# Usage:
#   ros2 run gnss_ros_standardization novatel_driver_node --ros-args --params-file config/novatel_driver.yaml

novatel_driver_node:
  ros__parameters:
    # ==========================================================================
    # Connection Settings
    # ==========================================================================
    # Stream path: serial://<device>:<baud> or tcpcli://<host>:<port> or file://<path>
    # Common bauds: 9600, 115200, 230400, 460800, 921600
    stream_path: "serial:///dev/ttyUSB1:230400"

    # Receiver format: "oem4" (OEM4/6/7) or "oem3" (OEM3/Millennium)
    format: "oem4"

    # Frame ID for checking TF
    frame_id: "gnss_link"

    # Publish rate in Hz (max dependent on receiver model and baud rate)
    publish_rate: 1

    # Receiver port to configure data output on (e.g., USB1, COM1, COM2)
    # This is used in the LOG command: LOG [receiver_port] [message] ONTIME [interval]
    receiver_port: "THISPORT"

    # Whether to send configuration commands on startup
    configure_on_startup: true

    # Topic Names
    observation_topic: "/gnss/observation"
    ephemeris_topic: "/gnss/ephemeris"

    # ==========================================================================
    # Message Configuration
    # ==========================================================================
    # Enable/Disable specific SBF blocks
    messages:
      # Observation Data
      rangecmp: true        # RANGECMPB (Compressed Range) - Recommended
      range: false          # RANGEB (Uncompressed Range)

      # Position / Velocity
      bestpos: false        # BESTPOSB
      bestvel: false        # BESTVELB

      # Navigation Data (Ephemeris)
      gps_ephem: true       # GPSEPHEMB
      glo_ephem: true       # GLOEPHEMERISB
      gal_ephem: true       # GALEPHEMERISB / GALINAVEPHEMERISB
      bds_ephem: true       # BDSEPHEMERISB
      qzs_ephem: true       # QZSSEPHEMERISB
      navic_ephem: false    # NAVICEPHEMERISB

      ionutc: false          # IONUTCB/GALIONOB/QZSSIONUTCB

      # NMEA output (used for GnssSolution topic via NmeaParser, ONTIME 1 = 1 Hz)
      nmea_gpgga: true       # GPGGA: position, fix quality, satellites, HDOP, altitude
      nmea_gprmc: true       # GPRMC: velocity (speed/course)
      nmea_gpgsa: true       # GPGSA: DOP values
      nmea_gpgst: true       # GPGST: position standard deviations (for covariance)

      # IMU output (requires NovAtel receiver with IMU connection)
      # RAWIMUSX:    uncalibrated counts × IMU-type-specific scale → /gnss/imu/data_raw
      # CORRIMUDATA: SPAN-corrected delta-velocity / delta-angle    → /gnss/imu/data
      # CORRIMUDATA additionally requires SPAN (Synchronized Position Attitude Navigation).
      rawimusx: true
      corrimudata: false

    solution_topic: "/gnss/solution"
    imu_topic:     "/gnss/imu/data"      # CORRIMUDATA (calibrated)
    imu_raw_topic: "/gnss/imu/data_raw"  # RAWIMUSX (uncalibrated)

    # IMU scale override (applies when IMU type is unknown to novatel_imu_scales.hpp).
    # Both fields must be non-zero to take effect; otherwise the built-in table is used.
    # Units: counts → SI per IMU sample (delta-velocity in m/s, delta-angle in rad).
    # See README "Supported NovAtel IMUs" for the type → scale mapping.
    imu_scale_override:
      accel: 0.0
      gyro:  0.0
