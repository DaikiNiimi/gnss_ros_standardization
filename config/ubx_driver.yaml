# u-blox Driver Configuration
# 
# Usage:
#   ros2 run gnss_ros_standardization ubx_driver_node --ros-args \
#     --params-file config/ubx_driver.yaml

ubx_driver_node:
  ros__parameters:
    # ==========================================================================
    # Basic Settings
    # ==========================================================================
    
    # Stream path (serial, tcp, ntrip, file)
    # Examples:
    #   serial:///dev/ttyACM0:115200
    #   serial:///dev/ttyUSB0:921600
    #   tcpcli://192.168.1.100:5000
    stream_path: "serial:///dev/ttyACM0:115200"
    
    # GNSS measurement rate in Hz (1-20). ESF-RAW (IMU) is not paced by this —
    # it streams at the sensor's native sample rate regardless.
    rate_hz: 10
    
    # ROS settings
    frame_id: "gnss_link"
    
    # Topic Names
    observation_topic: "/gnss/observation"
    ephemeris_topic: "/gnss/ephemeris"
    solution_topic: "/gnss/nmea_solution"
    imu_topic:     "/gnss/imu/data"      # ESF-INS (calibrated)
    imu_raw_topic: "/gnss/imu/data_raw"  # ESF-RAW (uncalibrated)

    # RTCM relay (PC -> receiver) for receiver on-chip RTK. See src/drivers/README.md.
    rtcm_relay:
      enabled: false           # set true (+ messages.nav_pvt/nav_hpposllh) for on-chip RTK
      listen: "tcpsvr://:5556" # RTKLIB stream path; ":port" binds all interfaces

    # ENU local origin settings
    auto_origin: true              # false: use origin below; true: first valid fix
    origin: [0.0, 0.0, 0.0]       # [lat_deg, lon_deg, alt_m (ellipsoidal)]
    
    # Send configuration commands on startup. false uses the receiver's
    # current config as-is (equivalent to ubx_decoder_node decode-only).
    configure_on_startup: true

    # Use GPS week/tow for message header stamps instead of system clock.
    # ESF-RAW (raw IMU) carries no GNSS time, so IMU stamps stay host-clock
    # based even when this is true (unlike Septentrio/NovAtel).
    use_gps_timestamp: false

    # Dynamic platform model
    # Options: portable, stationary, pedestrian, automotive, sea,
    #          airborne_1g, airborne_2g, airborne_4g, watch
    dynamic_model: "portable"
    
    # Receiver Generation
    # Options: G9 (F9P/M8 etc.), G10 (X20P etc.)
    # G9 uses legacy CFG commands, G10 uses CFG-VALSET
    generation: "G9"
    
    # ==========================================================================
    # Output Messages
    # ==========================================================================
    messages:
      # Raw measurement data (required for RTK/PPP)
      rawx: true
      
      # Subframe buffer data (navigation messages)
      sfrbx: true
      
      # Position/Velocity/Time solution — Binary PVT, preferred over NMEA.
      nav_pvt: true

      # NAV-COV (full 3x3 covariance) overwrites the diagonal-only NAV-PVT covariance.
      nav_dop: false       # NAV-DOP (0x01,0x04) → gdop/pdop/hdop/vdop
      nav_cov: false       # NAV-COV (0x01,0x36) → pos_enu_cov 3x3 + vel_enu_cov 3x3

      # Optional native ECEF position/velocity (most users can leave both false).
      nav_posecef: false   # NAV-POSECEF (0x01,0x01) → pos_ecef
      nav_velecef: false   # NAV-VELECEF (0x01,0x11) → vel_ecef

      # High-precision position (mm-level). Highest priority: HPPOS > NAV-PVT >
      # NMEA. Requires nav_pvt: true (HPPOS carries position only).
      nav_hpposllh: true    # NAV-HPPOSLLH (0x01,0x14) → latitude/longitude/altitude
      nav_hpposecef: false   # NAV-HPPOSECEF (0x01,0x13) → pos_ecef

      # NMEA messages (disable to save bandwidth)
      nmea_gga: false
      nmea_rmc: false
      nmea_gsa: false
      nmea_gst: false
      
      # NMEA High Precision mode
      # Enables extra decimal places in lat/lon for GGA, RMC, GLL
      nmea_high_precision: false

      # IMU messages (requires F9R or other IMU-enabled receiver). Both can be
      # enabled simultaneously; they publish to different topics.
      esf_raw: false   # ESF-RAW: uncalibrated, native IMU sample rate → /gnss/imu/data_raw
      esf_ins: false   # ESF-INS: receiver-calibrated angular rate + accel → /gnss/imu/data

    # ==========================================================================
    # GNSS Constellation Settings
    # ==========================================================================
    # All supported frequencies for each enabled constellation are configured
    # automatically (depends on hardware + RTKLIB decoder support).
    gnss:
      gps: true       # GPS (L1C/A, L2C, L5)
      glonass: true   # GLONASS (L1C, L2C)
      galileo: true   # Galileo (E1, E5a, E5b)
      beidou: true    # BeiDou (B1I, B2I)
      qzss: true      # QZSS (L1C/A, L2C, L5)
      navic: false    # NavIC (IRNSS)
      sbas: false     # SBAS (L1C/A)

    # Solution source (locked at startup): BINARY if nav_pvt is true, else NMEA.
    # Within BINARY, position priority per epoch: HPPOSLLH > NAV-PVT (LLH),
    # HPPOSECEF > NAV-POSECEF > derived from LLH (ECEF).

    ephemeris:
      snapshot_period_s: 30.0    # heartbeat interval when no new ephemeris arrives
      max_age_s:         7200.0  # drop entries older than this from snapshots (2 h)
