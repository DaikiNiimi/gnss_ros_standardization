# PPC dataset, Nagoya routes: common observation conditions with the RTK evaluation (L1/L2, SNR 35 dBHz, 15 deg, fix and hold).
gnss_imu_fgo:
  ros__parameters:
    topics:
      rover_observation: /gnss/observation
      base_observation: /base/gnss/observation
      ephemeris: /gnss/ephemeris
      imu: /gnss/imu/data_raw
      solution: /gnss/solution
    base_position:
      postype: ecef
      pos: [-3817680.7301, 3562839.5234, 3650159.2418]
    # IMU to the antenna recorded in rover.obs, body axes (FLU after imu_orientation), metres;
    # the dataset README lists (0.593, -0.670, -1.216) in FRD.
    lever_arm: [1.422, -0.171, 1.216]
    imu_orientation: [0.0, 0.0, 0.0]
    max_age_s: 30.0
    queue_depth: 4096
    # Observations: same names as real_time_kinematic (see the README for the SNR mask).
    frequencies:
      enable_l1: true
      enable_l2: true
      enable_l5: false
    pos1:
      elmask: 15.0
      navsys:
        gps: true
        gal: true
        bds: true
        qzs: true
      snrmask:
        rover: true
        base: true
        l1: [35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0]
        l2: [35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0]
        l5: [35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0, 35.0]
    pos2:
      armode: 3     # 0: off, 3: fix and hold
      arthres: 3.0
      minfixsats: 4
      slipthres: 0.15
    # Vehicle constraints: valid for this ground-vehicle dataset.
    nhc:
      enable: true
    zupt:
      enable: true
